name: CI

on:
  push:
    branches: [main, ai1, ai2, "feat/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    name: Build & Test (${{ matrix.os }}, Node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: [18, 20, 22]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies from clean lockfile
        run: npm ci

      - name: Static Type Checking
        run: npm run typecheck

      - name: Run Test Suite
        run: npm test

      - name: Build System (CLI & Web UI)
        run: npm run build

      - name: Run Benchmark Verification & Confusion Matrix
        run: npm run benchmark
